<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cargo Voyage: follow a shipment into Canada</title>
  <meta name="description" content="An animated, playable tutorial that follows one import or export shipment into Canada by sea or air: freight forwarders, bills of lading, ULDs, VGM, e-manifests, CBSA and CARM.">
  <meta name="theme-color" content="#13324d">

  <!-- Link previews for LinkedIn and other sites. Replace YOUR-USERNAME with your GitHub username. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Cargo Voyage: follow a shipment into Canada">
  <meta property="og:description" content="Pick sea or air, a route and a product, then play through every step of the shipment and learn the logistics terms along the way.">
  <meta property="og:image" content="https://YOUR-USERNAME.github.io/cargo-voyage/assets/preview.png">
  <meta property="og:url" content="https://YOUR-USERNAME.github.io/cargo-voyage/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Stencil+Display:wght@700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="on-menu">
  <div id="app">
    <header id="hud">
      <span class="brand">Cargo Voyage</span>
      <span id="hudMode"></span>
      <div id="progress" aria-hidden="true"></div>
      <span id="hudStep" class="sr-only" aria-live="polite"></span>
      <span id="hudScore"></span>
    </header>

    <main id="stage">
      <canvas id="scene" role="img" aria-label="Animated scene of the shipment"></canvas>
    </main>

    <section id="panel" aria-label="Lesson">
      <div class="lesson">
        <div class="lesson-head">
          <h2 id="stepTitle"></h2>
          <div class="meta">
            <span id="stepNum" class="step-num"></span>
            <span id="who" class="chip chip-who"></span>
            <span id="badge" class="chip"></span>
          </div>
        </div>
        <p id="narration" aria-live="polite"></p>
        <div id="terms" class="terms" aria-label="Terms in this step (tap for a definition)"></div>
        <p id="termDef" class="term-def" hidden></p>
      </div>
      <div class="actions">
        <div class="nav">
          <button id="btnBack" class="btn btn-quiet" type="button">Back</button>
          <button id="btnReplay" class="btn btn-quiet" type="button">Replay</button>
          <button id="btnNext" class="btn btn-go" type="button">Next step</button>
        </div>
        <div class="tools">
          <button id="btnGloss" class="btn btn-tool" type="button">Glossary</button>
          <button id="btnSound" class="btn btn-tool" type="button" aria-pressed="true">Sound on</button>
          <button id="btnFull" class="btn btn-tool" type="button">Full screen</button>
          <button id="btnMenu" class="btn btn-tool" type="button">Menu</button>
        </div>
      </div>
    </section>
  </div>

  <div id="overlay" hidden>
    <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
  </div>
  <div id="toast" role="alert" hidden></div>

  <noscript><p class="noscript">Cargo Voyage needs JavaScript to run.</p></noscript>

  <script src="js/content.js"></script>
  <script src="js/builder.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
